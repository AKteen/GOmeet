# Render Blueprint: GOmeet API + Postgres + Key Value (Redis).
# Create the blueprint from this file, then fill every sync: false value.
# Frontend is a separate Vercel project. Set CORS_ORIGINS to that https origin.
services:
  - type: web
    name: gomeet-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gomeet-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gomeet-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CHAT_APP_KEY
        sync: false
      - key: AGORA_CHAT_REST_HOST
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false

  - type: keyvalue
    name: gomeet-redis
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: gomeet-postgres
    databaseName: gomeet
    user: gomeet
